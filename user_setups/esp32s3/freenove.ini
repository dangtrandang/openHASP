[freenove_base]
extends = arduino_esp32s3_v2
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = opi_opi

build_flags =
    ${arduino_esp32s3_v2.build_flags}
    -D HASP_MODEL="Freenove S3 2.8"
    -D USER_SETUP_LOADED=1
    -include user_setups/esp32s3/Custom_Freenove_Setup.h

lib_deps =
    ${arduino_esp32s3_v2.lib_deps}
    ${tft_espi.lib_deps}

[env:esp32s3-freenove-28]
extends = freenove_base, flash_16mb
